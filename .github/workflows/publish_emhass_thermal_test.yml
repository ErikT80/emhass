name: Publish EMHASS Thermal Test image
on:
  push:
    branches:
      - release/thermal-min-on-v0.18.9
  workflow_dispatch:

concurrency:
  group: emhass-thermal-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/erikt80/emhass
  VERSION: v0.18.9-thermal1

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout exact release code
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}
          build-args: |
            TARGETARCH=${{ matrix.arch }}
            os_version=debian
            BUILD_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=thermal-test-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=thermal-test-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/ErikT80/emhass
            org.opencontainers.image.revision=${{ github.sha }}

  manifest:
    name: Publish multi-architecture test image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and inspect multi-architecture manifest
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-aarch64"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
