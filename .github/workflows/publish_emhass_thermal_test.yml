name: Publish EMHASS Thermal Test image
on:
  push:
    branches:
      - release/thermal-min-on-v0.18.9
  workflow_dispatch:

concurrency:
  group: emhass-thermal-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/erikt80/emhass
  VERSION: v0.18.10-ems1

jobs:
  build:
    name: Build ${{ matrix.arch }}
    if: github.ref == 'refs/heads/release/thermal-min-on-v0.18.9'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact release code
        uses: actions/checkout@v6
      - name: Check add-on image version
        run: test "$(awk '$1 == "version:" {print $2}' emhass-thermal-test/config.yaml)" = "$VERSION"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}
          build-args: |
            TARGETARCH=${{ matrix.arch }}
            os_version=debian
            BUILD_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=thermal-test-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=thermal-test-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/ErikT80/emhass
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify add-on API authentication
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash .github/scripts/smoke_emhass_thermal_test.sh "${IMAGE}:${VERSION}-${ARCH}"
      - name: Publish architecture image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker push "${IMAGE}:${VERSION}-${ARCH}"

  manifest:
    name: Publish multi-architecture test image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and inspect multi-architecture manifest
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-aarch64"
          docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture]
              | sort == ["amd64", "arm64"]'
