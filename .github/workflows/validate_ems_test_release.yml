name: Validate EMHASS Thermal Test candidates

on:
  push:
    branches: [validation/emhass-v0.18.10-ems1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.candidate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: Thermal minimum on-time
            ref: 33ce84e33d2fbf3bf4bed9cd6cacf4753530fa08
          - candidate: Battery fleet direction
            ref: 9c1eb415b29f6efcb5ce504d589dd3dbcd15a33d
          - candidate: Combined test app
            ref: f0df3b9ea9d178b1ccd727fc0d055a1bbc89a781
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the project's test dependencies
        run: uv sync --python 3.12 --upgrade --extra test
      - name: Lint and check formatting
        run: |
          uvx ruff check --no-fix .
          uvx ruff format --check .
      - name: Run the full pytest suite
        shell: bash
        run: |
          git rev-parse HEAD
          uv run pytest -ra | tee "$RUNNER_TEMP/pytest.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pytest-${{ matrix.ref }}
          path: ${{ runner.temp }}/pytest.log
          if-no-files-found: ignore
